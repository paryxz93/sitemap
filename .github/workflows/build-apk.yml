name: Build APK

# L'APK viene compilato qui e non in locale perche' i runner GitHub hanno gia'
# l'SDK Android installato. Il risultato e' scaricabile in due modi: come
# artifact della run, oppure come asset della release "apk-latest", che si apre
# direttamente dal browser del telefono senza autenticazione.

on:
  push:
    branches:
      - main
      - claude/spen-air-mouse-galaxy-8yswax
    paths:
      - 'spen-airmouse/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa piattaforma e build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Ricostruisce le librerie Samsung dal secret
        env:
          SPEN_SDK_LIBS_B64: ${{ secrets.SPEN_SDK_LIBS_B64 }}
        run: |
          # I jar del Pen Remote SDK non sono ridistribuibili e questo
          # repository e' pubblico, quindi non stanno in git. Arrivano da un
          # secret che contiene uno zip dei due jar in base64.
          if [ -z "$SPEN_SDK_LIBS_B64" ]; then
            echo "::error::Il secret SPEN_SDK_LIBS_B64 non e' impostato. Istruzioni in spen-airmouse/app/libs/README.md"
            exit 1
          fi
          printf '%s' "$SPEN_SDK_LIBS_B64" | base64 -d > /tmp/spen-libs.zip
          unzip -o /tmp/spen-libs.zip -d spen-airmouse/app/libs/
          # Verifica esplicita: senza il jar principale la compilazione
          # fallirebbe piu' avanti con un errore molto meno chiaro.
          if [ ! -f spen-airmouse/app/libs/spenremote-v1.0.1.jar ]; then
            echo "::error::spenremote-v1.0.1.jar non trovato nello zip del secret"
            exit 1
          fi
          ls -la spen-airmouse/app/libs/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('spen-airmouse/**/*.gradle.kts', 'spen-airmouse/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compila APK di debug
        working-directory: spen-airmouse
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rinomina l'APK
        id: apk
        working-directory: spen-airmouse
        run: |
          SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then
            echo "Nessun APK prodotto"
            exit 1
          fi
          DEST="spen-airmouse-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$DEST"
          echo "path=spen-airmouse/$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - name: Pubblica come artifact
        uses: actions/upload-artifact@v4
        with:
          name: spen-airmouse-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Pubblica la release scaricabile dal telefono
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release unica sempre aggiornata: il link resta lo stesso a ogni build.
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest \
              --title "S Pen Air Mouse, ultimo APK di debug" \
              --notes "APK di debug compilato automaticamente dal ramo di sviluppo. Firmato con la chiave di debug: installabile ma non pubblicabile su store." \
              --prerelease
          fi
          gh release upload apk-latest "${{ steps.apk.outputs.path }}" --clobber
